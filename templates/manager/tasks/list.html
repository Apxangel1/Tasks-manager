{% extends "manager/layouts/base.html" %}
{% block content %}
  <h1>List of tasks</h1>
    {% if tasks_list %}
      <ul>
        {% for task in tasks_list %}
          <li>
            {{ task.name }} {{ task.is_completed }}
            {{ task.deadline }} {{ task.assignees }}
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>There is no tasks yet.</p>
    {% endif %}
{% endblock %}
