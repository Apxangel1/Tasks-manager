{% extends "manager/layouts/base.html" %}
{% block content %}
  <section class="bg-white dark:bg-gray-900">
        <div class="grid py-8 px-4 mx-auto max-w-screen-xl lg:gap-8 xl:gap-0 lg:py-16 lg:grid-cols-12">
            <div class="place-self-center mr-auto lg:col-span-7">
                <h1
                    class="mb-4 max-w-2xl text-4xl font-extrabold tracking-tight leading-none md:text-5xl xl:text-6xl dark:text-white">
                    User Created Successfully!
                </h1>
                <div class="mb-6 max-w-2xl font-light text-gray-500 lg:mb-8 md:text-lg lg:text-xl dark:text-gray-400">
                    <p>Credentials to hand out:</p>
                    <ul>
                      <li>Username: <strong><strong>{{ username }}</strong></strong></li>
                      <li>Password: <strong><strong>{{ password }}</strong></strong></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
